[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "davinc-resolve-local-bridge-mcp"
version = "1.1.1"
description = "Control DaVinci Resolve from any AI assistant. 218 MCP tools covering the Resolve API and optional extensions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "The Geek Gods", email = "geekgodtech@gmail.com"},
]
keywords = ["davinci", "resolve", "mcp", "model-context-protocol", "video-editing", "fusion", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0,<3.0.0",
    "requests>=2.28.0",
]

[project.scripts]
davinc-resolve-local-bridge-mcp = "mcp_server.server:run"

[project.urls]
Homepage = "https://github.com/Airta-Admin/Davinc-Resolve-Local-Bridge-MCP"
Repository = "https://github.com/Airta-Admin/Davinc-Resolve-Local-Bridge-MCP"
Issues = "https://github.com/Airta-Admin/Davinc-Resolve-Local-Bridge-MCP/issues"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
